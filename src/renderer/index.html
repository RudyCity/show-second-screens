<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../../assets/icon.png">
  <title>Show Second Screens</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./grid.css">
</head>
<body>
  <!-- Movable & Sleek Titlebar Header -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <div class="brand">
        <img src="../../assets/icon.png" class="brand-logo" alt="Logo" onerror="this.style.display='none'" />
        <span>SHOW SCREEN</span>
        <span class="brand-dot" title="Live Streaming"></span>
      </div>
      <select class="screen-select" id="screenSelect" title="Select Target Monitor">
        <option value="">Detecting displays...</option>
      </select>
      <button class="btn" id="btnRefresh" title="Refresh connected displays">↻ Refresh</button>
      <button class="btn" id="btnIdentify" title="Show display numbers on every connected monitor for five seconds" aria-label="Identify connected displays">▣ Identify</button>
      <label class="fps-control" for="fpsSelect" title="Capture frame rate target for Single and Grid modes">
        <span>FPS</span>
        <select class="screen-select fps-select" id="fpsSelect" aria-label="Capture FPS target">
          <option value="15">15</option>
          <option value="24">24</option>
          <option value="30">30</option>
          <option value="60" selected>60</option>
        </select>
      </label>
      <div class="telemetry" id="fpsDisplay" title="Measured decoded video FPS / selected target">FPS: -- / 60</div>
      <div class="telemetry" id="coordDisplay">X: 0 Y: 0</div>
    </div>

    <div class="titlebar-right">
      <button class="btn" id="btnGrid" title="Toggle between single preview and all-monitor grid" aria-pressed="false">▦ Grid</button>
      <select class="screen-select" id="gridColumns" title="Grid columns" aria-label="Grid columns" hidden>
        <option value="auto">Auto columns</option>
        <option value="2">2 columns</option>
        <option value="3">3 columns</option>
        <option value="4">4 columns</option>
      </select>
      <button class="btn active" id="btnSmartHide" title="Automatically stop capturing the monitor hosting this window; does not power off the monitor" aria-pressed="true">◉ Smart Hide</button>
      <button class="btn active" id="btnPin" title="Toggle Always on Top">📌 Always On Top</button>
      <button class="btn" id="btnOpacity" title="Toggle Window Opacity">🌓 100%</button>
      <button class="btn btn-donate" id="btnDonate" title="Support development on Ko-fi (https://ko-fi.com/rudycity)">☕ Donate</button>
    </div>
  </header>

  <!-- Interactive Screen Mirror Viewport -->
  <main class="viewport-container" id="viewportContainer">
    <div class="status-placeholder" id="placeholder">
      <div class="spinner"></div>
      <span id="placeholderText">Initializing screen capture...</span>
    </div>

    <video id="screenVideo" class="screen-video" autoplay playsinline muted></video>
    <div id="screenGrid" class="screen-grid" aria-label="Connected monitor previews" hidden></div>
    <div id="dragHint" class="drag-hint" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="./gridMath.js"></script>
  <script src="./captureSettings.js"></script>
  <script src="./dragController.js"></script>
  <script src="./gridMode.js"></script>
  <script src="./smartHide.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
