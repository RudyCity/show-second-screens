<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Second Screens</title>
  <style>
    :root {
      --bg-base: #090a0f;
      --bg-panel: rgba(18, 20, 29, 0.88);
      --bg-panel-border: rgba(255, 255, 255, 0.08);
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --accent-cyan: #06b6d4;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --header-height: 38px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Sleek Draggable Header */
    .titlebar {
      height: var(--header-height);
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--bg-panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      -webkit-app-region: drag;
      z-index: 1000;
      transition: opacity 0.25s ease;
    }

    .titlebar.dimmed {
      opacity: 0.15;
    }

    .titlebar:hover {
      opacity: 1 !important;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-app-region: no-drag;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    /* Screen Select Dropdown */
    .screen-select {
      background: #1e2230;
      color: var(--text-main);
      border: 1px solid var(--bg-panel-border);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    .titlebar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    /* Action Buttons */
    .btn {
      background: #1e2230;
      border: 1px solid var(--bg-panel-border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      color: var(--text-main);
      background: #2a3044;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn.active {
      color: #fff;
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--accent);
    }

    .btn-close:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    /* Telemetry Badge */
    .telemetry {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* Preview Viewport Container */
    .viewport-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: crosshair;
      -webkit-app-region: no-drag;
    }

    video.screen-video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: auto;
      display: block;
    }

    /* Empty/Connecting state */
    .status-placeholder {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

  </style>
</head>
<body>
  <!-- Movable & Sleek Titlebar Header -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>SHOW SCREEN</span>
      </div>
      <select class="screen-select" id="screenSelect" title="Select Target Monitor">
        <option value="">Detecting displays...</option>
      </select>
      <div class="telemetry" id="fpsDisplay">FPS: --</div>
      <div class="telemetry" id="coordDisplay">X: 0 Y: 0</div>
    </div>

    <div class="titlebar-right">
      <button class="btn active" id="btnMode" title="Toggle Cursor Mode: Tetap di Sini (Ghost) vs Pindah Layar (Direct)">🎯 Tetap di Sini</button>
      <button class="btn active" id="btnPin" title="Toggle Always on Top">📌 Always On Top</button>
      <button class="btn" id="btnOpacity" title="Toggle Window Opacity">🌓 100%</button>
    </div>
  </header>

  <!-- Interactive Screen Mirror Viewport -->
  <main class="viewport-container" id="viewportContainer">
    <div class="status-placeholder" id="placeholder">
      <div class="spinner"></div>
      <span id="placeholderText">Initializing screen capture...</span>
    </div>

    <video id="screenVideo" class="screen-video" autoplay playsinline muted></video>
  </main>

  <script>
    // State
    let currentDisplays = [];
    let activeDisplay = null;
    let currentStream = null;
    let isAlwaysOnTop = true;
    let cursorMode = 'ghost'; // 'ghost' = cursor stays 100% on current desktop! 'direct' = cursor moves to target display
    let opacityLevels = [1.0, 0.85, 0.65];
    let opacityIndex = 0;
    let lastFrameTime = performance.now();
    let frameCount = 0;
    let fps = 0;

    // Elements
    const titlebar = document.getElementById('titlebar');
    const screenSelect = document.getElementById('screenSelect');
    const screenVideo = document.getElementById('screenVideo');
    const viewportContainer = document.getElementById('viewportContainer');
    const placeholder = document.getElementById('placeholder');
    const placeholderText = document.getElementById('placeholderText');
    const fpsDisplay = document.getElementById('fpsDisplay');
    const coordDisplay = document.getElementById('coordDisplay');
    const btnMode = document.getElementById('btnMode');
    const btnPin = document.getElementById('btnPin');
    const btnOpacity = document.getElementById('btnOpacity');

    // Titlebar Auto-dim on idle mouse
    let dimTimeout;
    function resetDimTimer() {
      titlebar.classList.remove('dimmed');
      clearTimeout(dimTimeout);
      dimTimeout = setTimeout(() => {
        titlebar.classList.add('dimmed');
      }, 3500);
    }
    window.addEventListener('mousemove', resetDimTimer);
    resetDimTimer();

    // Mode Toggle (Ghost Cursor vs Direct Warp)
    btnMode.addEventListener('click', () => {
      cursorMode = cursorMode === 'ghost' ? 'direct' : 'ghost';
      btnMode.textContent = cursorMode === 'ghost' ? '🎯 Tetap di Sini' : '🚀 Pindah Layar';
      btnMode.classList.toggle('active', cursorMode === 'ghost');
    });

    // Window Controls
    btnPin.addEventListener('click', () => {
      isAlwaysOnTop = !isAlwaysOnTop;
      window.electronAPI.setAlwaysOnTop(isAlwaysOnTop);
      btnPin.classList.toggle('active', isAlwaysOnTop);
    });

    btnOpacity.addEventListener('click', () => {
      opacityIndex = (opacityIndex + 1) % opacityLevels.length;
      const op = opacityLevels[opacityIndex];
      window.electronAPI.setOpacity(op);
      btnOpacity.textContent = `🌓 ${Math.round(op * 100)}%`;
    });

    // Coordinate Mapping Math Engine
    function calculateTargetCoordinates(e) {
      if (!activeDisplay) return null;

      const rect = screenVideo.getBoundingClientRect();
      if (!rect || rect.width <= 0 || rect.height <= 0) return null;

      // Intrinsic video dimensions from the active stream
      const videoW = screenVideo.videoWidth || activeDisplay.bounds.width;
      const videoH = screenVideo.videoHeight || activeDisplay.bounds.height;
      if (videoW <= 0 || videoH <= 0) return null;

      const streamAspect = videoW / videoH;
      const elemAspect = rect.width / rect.height;

      let renderWidth = rect.width;
      let renderHeight = rect.height;
      let offsetX = 0;
      let offsetY = 0;

      // Object-fit: contain letterbox & pillarbox computation
      if (elemAspect > streamAspect) {
        // Element is wider than stream: pillarbox (black bars on left & right)
        renderWidth = rect.height * streamAspect;
        renderHeight = rect.height;
        offsetX = (rect.width - renderWidth) / 2;
      } else {
        // Element is taller than stream: letterbox (black bars on top & bottom)
        renderWidth = rect.width;
        renderHeight = rect.width / streamAspect;
        offsetY = (rect.height - renderHeight) / 2;
      }

      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const relX = clickX - offsetX;
      const relY = clickY - offsetY;

      // Ignore interactions outside the rendered display content (black bars)
      if (relX < 0 || relX > renderWidth || relY < 0 || relY > renderHeight) {
        return null;
      }

      const u = Math.max(0, Math.min(1, relX / renderWidth));
      const v = Math.max(0, Math.min(1, relY / renderHeight));

      const bounds = activeDisplay.bounds;
      const targetX = Math.round(bounds.x + u * bounds.width);
      const targetY = Math.round(bounds.y + v * bounds.height);

      return { targetX, targetY, normX: u, normY: v };
    }

    // Interactive Input Simulation Listener on Video Preview
    let isMouseDown = false;
    let isDragging = false;
    let mouseDownData = null;
    let throttleTimeout = null;

    screenVideo.addEventListener('mousemove', (e) => {
      const coords = calculateTargetCoordinates(e);
      if (!coords) return;

      coordDisplay.textContent = `X: ${coords.targetX} Y: ${coords.targetY}`;

      // In Ghost mode: cursor stays 100% on current desktop during hover and clicks!
      if (cursorMode === 'ghost') {
        if (isMouseDown && mouseDownData) {
          const dx = e.clientX - mouseDownData.clientX;
          const dy = e.clientY - mouseDownData.clientY;
          const dist = Math.hypot(dx, dy);

          // Initiate drag only when moved beyond 5px threshold
          if (!isDragging && dist > 5) {
            isDragging = true;
            window.electronAPI.sendInput({
              type: 'dragstart',
              button: mouseDownData.button,
              x: mouseDownData.targetX,
              y: mouseDownData.targetY,
              origX: mouseDownData.screenX,
              origY: mouseDownData.screenY,
              mode: 'ghost',
            });
          }

          if (isDragging) {
            window.electronAPI.sendInput({
              type: 'drag',
              x: coords.targetX,
              y: coords.targetY,
              origX: e.screenX,
              origY: e.screenY,
              mode: 'ghost',
            });
          }
        }
        return;
      }

      // In Direct mode: warp cursor to target screen
      if (!throttleTimeout) {
        throttleTimeout = setTimeout(() => {
          throttleTimeout = null;
          window.electronAPI.sendInput({
            type: 'mousemove',
            x: coords.targetX,
            y: coords.targetY,
            mode: 'direct',
          });
        }, 16);
      }
    });

    screenVideo.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const coords = calculateTargetCoordinates(e);
      if (!coords) return;

      const button = e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';
      isMouseDown = true;
      isDragging = false;
      mouseDownData = {
        clientX: e.clientX,
        clientY: e.clientY,
        screenX: e.screenX,
        screenY: e.screenY,
        targetX: coords.targetX,
        targetY: coords.targetY,
        button: button,
      };

      if (cursorMode === 'direct') {
        window.electronAPI.sendInput({
          type: 'mousedown',
          button: button,
          x: coords.targetX,
          y: coords.targetY,
          mode: 'direct',
        });
      }
      // Note: In Ghost mode, do NOT send mousedown or warp cursor to target screen!
      // This ensures clicks never warp the physical cursor away from the preview window.
    });

    screenVideo.addEventListener('mouseup', (e) => {
      e.preventDefault();
      const coords = calculateTargetCoordinates(e);
      if (!coords) return;

      const button = e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';

      if (cursorMode === 'ghost') {
        if (isDragging) {
          window.electronAPI.sendInput({
            type: 'dragend',
            button: button,
            x: coords.targetX,
            y: coords.targetY,
            origX: e.screenX,
            origY: e.screenY,
            mode: 'ghost',
          });
        } else {
          // Normal clean click: single atomic injection at target coordinates,
          // instantly restoring the physical cursor to (e.screenX, e.screenY).
          window.electronAPI.sendInput({
            type: 'click',
            button: button,
            x: coords.targetX,
            y: coords.targetY,
            origX: e.screenX,
            origY: e.screenY,
            mode: 'ghost',
          });
        }
      } else {
        window.electronAPI.sendInput({
          type: 'mouseup',
          button: button,
          x: coords.targetX,
          y: coords.targetY,
          mode: 'direct',
        });
      }

      isMouseDown = false;
      isDragging = false;
      mouseDownData = null;
    });

    // Suppress default/redundant browser click & contextmenu events since mouseup handles them
    screenVideo.addEventListener('click', (e) => {
      e.preventDefault();
    });

    screenVideo.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    screenVideo.addEventListener('dblclick', (e) => {
      e.preventDefault();
      const coords = calculateTargetCoordinates(e);
      if (!coords) return;

      window.electronAPI.sendInput({
        type: 'dblclick',
        x: coords.targetX,
        y: coords.targetY,
        origX: e.screenX,
        origY: e.screenY,
        mode: cursorMode,
      });
    });

    screenVideo.addEventListener('wheel', (e) => {
      e.preventDefault();
      const coords = calculateTargetCoordinates(e);
      if (!coords) return;

      window.electronAPI.sendInput({
        type: 'wheel',
        deltaY: e.deltaY,
        x: coords.targetX,
        y: coords.targetY,
        origX: e.screenX,
        origY: e.screenY,
        mode: cursorMode,
      });
    }, { passive: false });

    screenVideo.addEventListener('mouseleave', () => {
      if (isDragging && activeDisplay && mouseDownData) {
        window.electronAPI.sendInput({
          type: 'dragend',
          button: 'left',
          x: mouseDownData.targetX,
          y: mouseDownData.targetY,
          origX: mouseDownData.screenX,
          origY: mouseDownData.screenY,
          mode: cursorMode,
        });
      }
      isMouseDown = false;
      isDragging = false;
      mouseDownData = null;
    });

    // Stream Setup & Display Switching
    async function switchDisplay(display) {
      if (!display || !display.sourceId) return;

      activeDisplay = display;
      placeholder.style.display = 'flex';
      placeholderText.textContent = `Connecting to ${display.name}...`;

      if (currentStream) {
        currentStream.getTracks().forEach((track) => track.stop());
        currentStream = null;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            mandatory: {
              chromeMediaSource: 'desktop',
              chromeMediaSourceId: display.sourceId,
              minWidth: display.bounds.width,
              maxWidth: display.bounds.width,
              minHeight: display.bounds.height,
              maxHeight: display.bounds.height,
              minFrameRate: 30,
              maxFrameRate: 60,
            },
            optional: [
              { cursor: 'never' },
            ],
          },
        });

        currentStream = stream;
        screenVideo.srcObject = stream;
        screenVideo.onloadedmetadata = () => {
          screenVideo.play();
          placeholder.style.display = 'none';
        };
      } catch (err) {
        console.error('Error starting screen stream:', err);
        placeholderText.textContent = `Failed to stream ${display.name}: ${err.message}`;
      }
    }

    // Display Enumeration
    async function loadDisplays() {
      try {
        currentDisplays = await window.electronAPI.getDisplays();
        screenSelect.innerHTML = '';

        if (!currentDisplays || currentDisplays.length === 0) {
          screenSelect.innerHTML = '<option value="">No displays found</option>';
          placeholderText.textContent = 'No active monitors detected.';
          return;
        }

        currentDisplays.forEach((disp, idx) => {
          const opt = document.createElement('option');
          opt.value = disp.id;
          opt.textContent = `${disp.name} (${disp.bounds.width}x${disp.bounds.height})`;
          screenSelect.appendChild(opt);
        });

        // Default to secondary display if available, else primary
        const secondary = currentDisplays.find((d) => !d.isPrimary);
        const target = secondary || currentDisplays[0];
        screenSelect.value = target.id;
        switchDisplay(target);
      } catch (err) {
        console.error('Error loading displays:', err);
      }
    }

    screenSelect.addEventListener('change', () => {
      const selected = currentDisplays.find((d) => d.id === screenSelect.value);
      if (selected) {
        switchDisplay(selected);
      }
    });

    // FPS Telemetry Counter
    function updateTelemetry() {
      frameCount++;
      const now = performance.now();
      const elapsed = now - lastFrameTime;
      if (elapsed >= 1000) {
        fps = Math.round((frameCount * 1000) / elapsed);
        fpsDisplay.textContent = `FPS: ${fps}`;
        frameCount = 0;
        lastFrameTime = now;
      }
      requestAnimationFrame(updateTelemetry);
    }
    requestAnimationFrame(updateTelemetry);

    // Initial load
    loadDisplays();
  </script>
</body>
</html>
